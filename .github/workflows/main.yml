
name: Aetheria iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Aetheria for iOS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        run: bun run build:ios

      - name: Sync Capacitor iOS
        run: bunx cap sync ios

      - name: Build iOS application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/ios/Build/Products/Release-iphoneos/App.app"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../../Aetheria-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-unsigned-IPA
          path: Aetheria-unsigned.ipa
          if-no-files-found: error

      - name: Upload Xcode build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-build-logs
          path: build/ios/Logs/
          if-no-files-found: ignore
